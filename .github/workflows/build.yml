name: Build Run Tracker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate test signing keystore
        run: |
          keytool -genkeypair \
            -keystore runtracker-release.jks \
            -alias runtracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "RunTracker2026Secure!" \
            -keypass "RunTracker2026Secure!" \
            -dname "CN=RunTracker, OU=Mobile, O=RunTracker, L=India, ST=UP, C=IN"

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: RunTracker2026Secure!
          KEY_ALIAS: runtracker
          KEY_PASSWORD: RunTracker2026Secure!
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RunTracker-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RunTracker-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
