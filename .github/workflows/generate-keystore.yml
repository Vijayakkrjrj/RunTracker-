name: Generate RunTracker Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore runtracker-release.jks \
            -alias runtracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "RunTrackerTemp123!" \
            -keypass "RunTrackerTemp123!" \
            -dname "CN=RunTracker, OU=Mobile, O=RunTracker, L=India, ST=UP, C=IN"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: runtracker-keystore
          path: runtracker-release.jks
