name: Verify RunTracker Signing

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > runtracker-release.jks
          chmod 600 runtracker-release.jks

      - name: Verify keystore password and alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Checking keystore..."

          keytool -list \
            -keystore runtracker-release.jks \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Checking alias..."

          keytool -list \
            -keystore runtracker-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "KEYSTORE AND ALIAS CHECK PASSED"
